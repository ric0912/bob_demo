name: Deploy to IBM Code Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IBM_CLOUD_REGION: us-south
  CODE_ENGINE_PROJECT: skysecure-proj

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install code-engine -f
      
      - name: Authenticate with IBM Cloud
        run: |
          ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} -r ${{ env.IBM_CLOUD_REGION }}
          ibmcloud target -g Default
      
      - name: Create or Select Code Engine Project
        run: |
          # Check if project exists
          if ! ibmcloud ce project get --name ${{ env.CODE_ENGINE_PROJECT }} &>/dev/null; then
            echo "Project not found. Creating new Code Engine project..."
            ibmcloud ce project create --name ${{ env.CODE_ENGINE_PROJECT }}
            echo "Project created successfully!"
          else
            echo "Project already exists. Selecting it..."
          fi
          ibmcloud ce project select --name ${{ env.CODE_ENGINE_PROJECT }}
          echo "Project selected: ${{ env.CODE_ENGINE_PROJECT }}"
      
      - name: Deploy Backend to Code Engine
        run: |
          
          # Check if application exists
          if ibmcloud ce application get --name fleet-backend &>/dev/null; then
            echo "Updating existing application..."
            ibmcloud ce application update --name fleet-backend \
              --build-source . \
              --build-context-dir backend \
              --env DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              --env USE_SQLITE="${{ secrets.USE_SQLITE }}" \
              --env GENERATE_DUMMY_DATA="${{ secrets.GENERATE_DUMMY_DATA }}" \
              --env SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              --env CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
              --wait
          else
            echo "Creating new application..."
            ibmcloud ce application create --name fleet-backend \
              --build-source . \
              --build-context-dir backend \
              --env DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              --env USE_SQLITE="${{ secrets.USE_SQLITE }}" \
              --env GENERATE_DUMMY_DATA="${{ secrets.GENERATE_DUMMY_DATA }}" \
              --env SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              --env CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
              --port 8000 \
              --min-scale 1 \
              --max-scale 1 \
              --cpu 1 \
              --memory 1G \
              --concurrency 100 \
              --wait
          fi
      
      - name: Verify Backend Deployment
        run: |
          echo "Waiting for application to be ready..."
          sleep 30
          
          ibmcloud ce application get --name fleet-backend
          URL=$(ibmcloud ce application get --name fleet-backend --output json | jq -r '.status.url')
          
          echo "Testing health endpoint at $URL/health"
          curl -f $URL/health || exit 1
          
          echo "Backend deployment successful!"
          echo "Backend URL: $URL"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install code-engine -f
      
      - name: Authenticate with IBM Cloud
        run: |
          ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} -r ${{ env.IBM_CLOUD_REGION }}
          ibmcloud target -g Default
      
      - name: Select Code Engine Project
        run: |
          ibmcloud ce project select --name ${{ env.CODE_ENGINE_PROJECT }}
          echo "Project selected: ${{ env.CODE_ENGINE_PROJECT }}"
      
      - name: Get Backend URL
        id: backend-url
        run: |
          BACKEND_URL=$(ibmcloud ce application get --name fleet-backend --output json | jq -r '.status.url')
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $BACKEND_URL"
      
      - name: Deploy Frontend to Code Engine
        env:
          VITE_API_URL: ${{ steps.backend-url.outputs.backend_url }}
        run: |
          ibmcloud ce project select --name ${{ env.CODE_ENGINE_PROJECT }}
          
          # Check if application exists
          if ibmcloud ce application get --name fleet-frontend &>/dev/null; then
            echo "Updating existing application..."
            ibmcloud ce application update --name fleet-frontend \
              --build-source . \
              --build-context-dir frontend \
              --build-dockerfile Dockerfile \
              --env VITE_API_URL=${{ steps.backend-url.outputs.backend_url }} \
              --wait
          else
            echo "Creating new application..."
            ibmcloud ce application create --name fleet-frontend \
              --build-source . \
              --build-context-dir frontend \
              --build-dockerfile Dockerfile \
              --env VITE_API_URL=${{ steps.backend-url.outputs.backend_url }} \
              --port 80 \
              --min-scale 1 \
              --max-scale 5 \
              --cpu 0.25 \
              --memory 512M \
              --wait
          fi
      
      - name: Verify Frontend Deployment
        run: |
          echo "Waiting for application to be ready..."
          sleep 30
          
          ibmcloud ce application get --name fleet-frontend
          URL=$(ibmcloud ce application get --name fleet-frontend --output json | jq -r '.status.url')
          
          echo "Testing frontend at $URL"
          curl -f $URL || exit 1
          
          echo "Frontend deployment successful!"
          echo "Frontend URL: $URL"
      
      - name: Deployment Summary
        run: |
          ibmcloud ce project select --name ${{ env.CODE_ENGINE_PROJECT }}
          
          BACKEND_URL=$(ibmcloud ce application get --name fleet-backend --output json | jq -r '.status.url')
          FRONTEND_URL=$(ibmcloud ce application get --name fleet-frontend --output json | jq -r '.status.url')
          
          echo "=========================================="
          echo "Deployment Complete!"
          echo "=========================================="
          echo "Backend API: $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"
          echo "API Docs: $BACKEND_URL/docs"
          echo "=========================================="

